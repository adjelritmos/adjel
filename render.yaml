# Render Blueprint — portfólio 3D (Vite + React, site estático)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: adjel-portfolio
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA: qualquer caminho desconhecido devolve o index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # ficheiros do Vite têm hash no nome → cache longa
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # modelo 3D e fotos não têm hash → cache de 1 dia
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /me/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
